<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco Croquetero</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f2;
      color: #18212f;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f3f7f2;
      padding-bottom: 110px;
    }

    .hero {
      background: linear-gradient(135deg, #2f9e44 0%, #24863a 100%);
      color: white;
      padding: 24px 18px 30px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 12px 28px rgba(47, 158, 68, 0.22);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 66px;
      height: 66px;
      border-radius: 18px;
      background: #d9a441;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 700;
    }

    .title {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 900;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .content {
      padding: 16px;
      margin-top: -12px;
    }

    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .status-card {
      padding: 15px 16px;
    }

    .label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 0 0 8px;
    }

    .status-text {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .summary {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .summary-total {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: #111827;
      line-height: 1;
    }

    .summary-side {
      background: #edf7ef;
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 94px;
      text-align: center;
    }

    .summary-side .num {
      margin: 4px 0 0;
      font-size: 24px;
      font-weight: 900;
      color: #2f9e44;
      line-height: 1;
    }

    .section-head {
      padding: 16px 16px 10px;
      border-bottom: 1px solid #f1f3f5;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .player {
      padding: 16px;
      border-top: 1px solid #f1f3f5;
    }

    .player:first-child {
      border-top: none;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .player-name {
      margin: 0 0 5px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
    }

    .player-meta {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
    }

    .badge-total {
      background: #edf7ef;
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 118px;
      text-align: right;
      flex-shrink: 0;
    }

    .badge-total .small {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7280;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: 0.8px;
    }

    .badge-total .big {
      font-size: 17px;
      color: #2f9e44;
      font-weight: 900;
      line-height: 1.1;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .detail {
      background: #f8faf8;
      border-radius: 12px;
      padding: 10px;
    }

    .detail .d-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .detail .d-value {
      font-size: 13px;
      font-weight: 900;
      color: #111827;
      line-height: 1.2;
    }

    .empty {
      padding: 32px 18px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 14px 18px;
      background: linear-gradient(to top, rgba(243,247,242,1) 70%, rgba(243,247,242,0));
    }

    .bottom-inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 16px 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-light {
      background: white;
      color: #1f2937;
    }

    .btn-green {
      background: #2f9e44;
      color: white;
    }

    @media (max-width: 420px) {
      .title {
        font-size: 24px;
      }

      .summary-total {
        font-size: 24px;
      }

      .player-top {
        flex-direction: column;
      }

      .badge-total {
        width: 100%;
        text-align: left;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="brand">
        <div class="logo">🧆</div>
        <div>
          <p class="eyebrow">Croquetas Power</p>
          <h1 class="title">BANCO CROQUETERO</h1>
          <p class="subtitle">Gestión rápida de pagos de jornada</p>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card status-card">
        <p class="label">Estado</p>
        <p class="status-text" id="estado">Pulsa PREVISUALIZAR para cargar la jornada.</p>
      </div>

      <div class="card">
        <div class="summary">
          <div>
            <p class="label">Total jornada</p>
            <p class="summary-total" id="totalJornada">0€</p>
          </div>
          <div class="summary-side">
            <p class="label" style="margin:0;">Jugadores</p>
            <p class="num" id="numJugadores">0</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2 class="section-title">Resumen de pagos</h2>
        </div>
        <div id="resultado">
          <div class="empty">Todavía no hay pagos cargados.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <button class="btn-light" id="btnPreview" onclick="preview()">PREVISUALIZAR</button>
      <button class="btn-green" id="btnPago" onclick="confirmar()">💸 PAGO</button>
    </div>
  </div>

  <script>
    const API = "https://banco-croquetero.onrender.com";

    function euros(valor) {
      return Number(valor || 0).toLocaleString("es-ES") + "€";
    }

    function medalla(posicion) {
      if (posicion === 1) return "🥇";
      if (posicion === 2) return "🥈";
      if (posicion === 3) return "🥉";
      return "⚽";
    }

    async function preview() {
      const btn = document.getElementById("btnPreview");
      const estado = document.getElementById("estado");
      const resultado = document.getElementById("resultado");

      btn.disabled = true;
      btn.textContent = "CARGANDO...";
      estado.textContent = "Cargando pagos de la jornada...";

      try {
        const res = await fetch(API + "/pagos");
        if (!res.ok) throw new Error("No se han podido cargar los pagos.");

        const data = await res.json();
        const total = data.reduce((acc, j) => acc + (j.total || 0), 0);

        document.getElementById("totalJornada").textContent = euros(total);
        document.getElementById("numJugadores").textContent = data.length;
        estado.textContent = "Resumen cargado correctamente.";

        if (!data.length) {
          resultado.innerHTML = '<div class="empty">No hay datos disponibles.</div>';
          return;
        }

        resultado.innerHTML = data.map(j => `
          <div class="player">
            <div class="player-top">
              <div>
                <p class="player-name">${medalla(j.posicion)} ${j.nombre}</p>
                <p class="player-meta">${j.puntos} pts · Puesto ${j.posicion}</p>
              </div>
              <div class="badge-total">
                <div class="small">Total</div>
                <div class="big">+${euros(j.total)}</div>
              </div>
            </div>

            <div class="details">
              <div class="detail">
                <div class="d-label">Premio</div>
                <div class="d-value">${euros(j.premio)}</div>
              </div>
              <div class="detail">
                <div class="d-label">Bonus</div>
                <div class="d-value">${euros(j.bonus)}</div>
              </div>
              <div class="detail">
                <div class="d-label">Once</div>
                <div class="d-value">${euros(j.bonusOnce)}</div>
              </div>
            </div>
          </div>
        `).join("");
      } catch (error) {
        estado.textContent = error.message || "Error al cargar pagos.";
        resultado.innerHTML = '<div class="empty">No se pudo cargar la información.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = "PREVISUALIZAR";
      }
    }

    async function confirmar() {
      const btn = document.getElementById("btnPago");
      const estado = document.getElementById("estado");

      btn.disabled = true;
      btn.textContent = "ENVIANDO...";
      estado.textContent = "Enviando pagos al grupo...";

      try {
        const res = await fetch(API + "/confirmar");
        const txt = await res.text();

        if (!res.ok) throw new Error(txt || "No se pudo enviar el pago.");

        estado.textContent = txt || "Pagos enviados correctamente.";
        alert("💸 Pagos enviados");
      } catch (error) {
        estado.textContent = error.message || "Error enviando pagos.";
        alert("❌ Error al enviar pagos");
      } finally {
        btn.disabled = false;
        btn.textContent = "💸 PAGO";
      }
    }
  </script>
</body>
</html>
