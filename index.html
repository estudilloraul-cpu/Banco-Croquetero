<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Croquetero</title>

<style>
body {
  font-family: Arial;
  background: #f2f5f2;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

h1 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}

.btn-blue { background: #2563eb; color: white; }
.btn-green { background: #16a34a; color: white; }
.btn-gray { background: #e5e7eb; }
.btn-red { background: #ef4444; color: white; }

.card {
  background: white;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
}

.small {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="container">

<h1>🧆 Banco Croquetero</h1>

<p id="estado">Copia datos desde Comuniazo y pulsa PEGAR</p>

<button class="btn-blue" onclick="pegarTexto()">PEGAR</button>
<button class="btn-gray" onclick="preview()">PREVISUALIZAR</button>
<button class="btn-green" onclick="confirmar()">💸 PAGO</button>
<button class="btn-red" onclick="resetear()">RESET</button>

<div id="jugadores"></div>

<div class="card">
<h3>Resultado</h3>
<div id="resultado"></div>
</div>

</div>

<script>

let jugadores = [];
let ultimoResumen = [];

const API = "https://banco-croquetero.onrender.com";

function renderJugadores() {
  const cont = document.getElementById("jugadores");

  cont.innerHTML = jugadores.map((j, i) => `
    <div class="card">
      <b>${j.nombre}</b>
      <div class="small">Puntos: ${j.puntos}</div>
      <input type="number" value="${j.once}" onchange="cambiarOnce(${i}, this.value)" placeholder="Once ideal">
    </div>
  `).join("");
}

function cambiarOnce(i, val) {
  jugadores[i].once = Number(val || 0);
}

async function pegarTexto() {
  const estado = document.getElementById("estado");

  try {
    const texto = await navigator.clipboard.readText();

    const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);

    const datos = [];

    for (const linea of lineas) {
      const partes = linea.split(" ");

      const puntos = parseInt(partes[partes.length - 1]);
      if (isNaN(puntos)) continue;

      const nombre = partes.slice(0, -1).join(" ");

      datos.push({
        nombre,
        puntos,
        once: 0
      });
    }

    jugadores = datos;
    renderJugadores();

    estado.textContent = "Jugadores importados correctamente";

  } catch {
    estado.textContent = "Error al pegar";
  }
}

function calcular() {

  const orden = [...jugadores].sort((a,b)=>b.puntos-a.puntos);

  return orden.map((j,i)=>{

    let premio = [1500000,1250000,1000000,750000,500000,250000][i] || 0;

    let bonus = 0;
    if (j.puntos > 50) {
      bonus = (Math.floor((j.puntos - 50)/10)+1)*250000;
    }

    let bonusOnce = j.once * 400000;

    return {
      ...j,
      posicion: i+1,
      premio,
      bonus,
      bonusOnce,
      total: premio+bonus+bonusOnce
    };
  });
}

function preview() {
  ultimoResumen = calcular();

  const html = ultimoResumen.map(j => `
    <div class="card">
      <b>${j.posicion}. ${j.nombre}</b><br>
      ${j.puntos} pts<br>
      💰 ${j.total.toLocaleString()}€
    </div>
  `).join("");

  document.getElementById("resultado").innerHTML = html;
}

async function confirmar() {
  if (!ultimoResumen.length) preview();

  await fetch(API + "/confirmar", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(ultimoResumen)
  });

  alert("Pagos enviados 💸");
}

function resetear() {
  jugadores = [];
  ultimoResumen = [];
  document.getElementById("jugadores").innerHTML = "";
  document.getElementById("resultado").innerHTML = "";
  document.getElementById("estado").textContent = "Reseteado";
}

</script>

</body>
</html>
