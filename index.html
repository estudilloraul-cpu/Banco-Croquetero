<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco Croquetero</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f2;
      color: #18212f;
    }
    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f3f7f2;
      padding-bottom: 130px;
    }
    .hero {
      background: linear-gradient(135deg, #2f9e44 0%, #24863a 100%);
      color: white;
      padding: 24px 18px 30px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 12px 28px rgba(47, 158, 68, 0.22);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 66px;
      height: 66px;
      border-radius: 18px;
      background: #d9a441;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }
    .eyebrow {
      margin: 0 0 5px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 700;
    }
    .title {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 900;
    }
    .subtitle {
      margin: 10px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }
    .content {
      padding: 16px;
      margin-top: -12px;
    }
    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-inner {
      padding: 16px;
    }
    .label {
      font-size: 11px;
      color: #6b7280;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 0 0 8px;
    }
    .status-text {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }
    .summary {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .summary-total {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      color: #111827;
      line-height: 1;
    }
    .summary-side {
      background: #edf7ef;
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 94px;
      text-align: center;
    }
    .summary-side .num {
      margin: 4px 0 0;
      font-size: 24px;
      font-weight: 900;
      color: #2f9e44;
      line-height: 1;
    }
    .section-head {
      padding: 16px 16px 10px;
      border-bottom: 1px solid #f1f3f5;
    }
    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }
    .player-edit {
      padding: 14px 16px;
      border-top: 1px solid #f1f3f5;
    }
    .player-edit:first-child {
      border-top: none;
    }
    .player-edit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .player-edit-name {
      font-size: 16px;
      font-weight: 900;
      margin: 0;
    }
    .player-edit-actions {
      display: flex;
      gap: 8px;
    }
    .mini-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      background: #f3f4f6;
    }
    .mini-btn.danger {
      background: #fee2e2;
      color: #991b1b;
    }
    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 120px 120px;
      gap: 10px;
    }
    .input, .number-input {
      width: 100%;
      border: 1px solid #dbe2e8;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      background: white;
    }
    .input:focus, .number-input:focus {
      border-color: #2f9e44;
    }
    .empty {
      padding: 32px 18px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
    }
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 14px 18px;
      background: linear-gradient(to top, rgba(243,247,242,1) 70%, rgba(243,247,242,0));
    }
    .bottom-inner {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 16px;
      padding: 16px 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-light { background: white; color: #1f2937; }
    .btn-green { background: #2f9e44; color: white; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .add-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      margin-top: 10px;
    }
    .player {
      padding: 16px;
      border-top: 1px solid #f1f3f5;
    }
    .player:first-child { border-top: none; }
    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .player-name {
      margin: 0 0 5px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.2;
    }
    .player-meta {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-total {
      background: #edf7ef;
      border-radius: 14px;
      padding: 10px 12px;
      min-width: 118px;
      text-align: right;
      flex-shrink: 0;
    }
    .badge-total .small {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7280;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: 0.8px;
    }
    .badge-total .big {
      font-size: 17px;
      color: #2f9e44;
      font-weight: 900;
      line-height: 1.1;
    }
    .details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .detail {
      background: #f8faf8;
      border-radius: 12px;
      padding: 10px;
    }
    .detail .d-label {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .detail .d-value {
      font-size: 13px;
      font-weight: 900;
      color: #111827;
      line-height: 1.2;
    }
    @media (max-width: 520px) {
      .bottom-inner {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 420px) {
      .title { font-size: 24px; }
      .summary-total { font-size: 24px; }
      .player-top { flex-direction: column; }
      .badge-total { width: 100%; text-align: left; }
      .details, .edit-grid, .add-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="brand">
        <div class="logo">🧆</div>
        <div>
          <p class="eyebrow">Croquetas Power</p>
          <h1 class="title">BANCO CROQUETERO</h1>
          <p class="subtitle">Sincroniza, calcula y reporta pagos</p>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-inner">
          <p class="label">Estado</p>
          <p class="status-text" id="estado">Pulsa SINCRONIZAR para traer datos.</p>
        </div>
      </div>

      <div class="card">
        <div class="summary">
          <div>
            <p class="label">Total jornada</p>
            <p class="summary-total" id="totalJornada">0€</p>
          </div>
          <div class="summary-side">
            <p class="label" style="margin:0;">Jugadores</p>
            <p class="num" id="numJugadores">0</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2 class="section-title">Gestionar jugadores</h2>
        </div>
        <div id="editorJugadores"></div>
        <div class="card-inner">
          <p class="label">Añadir jugador</p>
          <div class="add-row">
            <input id="nuevoNombre" class="input" placeholder="Nombre del jugador" />
            <button class="btn-light" onclick="agregarJugador()">AÑADIR</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2 class="section-title">Resumen de pagos</h2>
        </div>
        <div id="resultado">
          <div class="empty">Todavía no hay pagos calculados.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <button class="btn-blue" onclick="syncComuniate()">SINCRONIZAR</button>
      <button class="btn-light" id="btnPreview" onclick="preview()">PREVISUALIZAR</button>
      <button class="btn-green" id="btnPago" onclick="confirmar()">💸 PAGO</button>
      <button class="btn-red" onclick="resetear()">RESET</button>
    </div>
  </div>

  <script>
    const API = "https://banco-croquetero.onrender.com";
    const SCRAPER_API = "https://independent-nurturing-production-353d.up.railway.app";
    const STORAGE_KEY = "bancoCroqueteroJugadores";
    let ultimoResumen = [];

    const jugadoresIniciales = [];

    function cargarJugadores() {
      const guardados = localStorage.getItem(STORAGE_KEY);
      if (!guardados) return jugadoresIniciales;
      try {
        const data = JSON.parse(guardados);
        return Array.isArray(data) ? data : jugadoresIniciales;
      } catch {
        return jugadoresIniciales;
      }
    }

    let jugadores = cargarJugadores();

    function guardarJugadores() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(jugadores));
    }

    function euros(valor) {
      return Number(valor || 0).toLocaleString("es-ES") + "€";
    }

    function medalla(posicion) {
      if (posicion === 1) return "🥇";
      if (posicion === 2) return "🥈";
      if (posicion === 3) return "🥉";
      return "⚽";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function calcularPagos(data) {
      const ordenados = [...data]
        .map(j => ({
          nombre: (j.nombre || "").trim(),
          puntos: Number(j.puntos || 0),
          once: Number(j.once || 0)
        }))
        .filter(j => j.nombre)
        .sort((a, b) => b.puntos - a.puntos);

      const premios = {
        1: 1500000,
        2: 1250000,
        3: 1000000,
        4: 750000,
        5: 500000,
        6: 250000
      };

      return ordenados.map((j, index) => {
        const posicion = index + 1;
        const premio = premios[posicion] || 0;

        let bonus = 0;
        if (j.puntos > 50) {
          bonus = (Math.floor((j.puntos - 50) / 10) + 1) * 250000;
        }

        const bonusOnce = Number(j.once || 0) * 400000;
        const total = premio + bonus + bonusOnce;

        return {
          ...j,
          posicion,
          premio,
          bonus,
          bonusOnce,
          total
        };
      });
    }

    function renderEditor() {
      const cont = document.getElementById("editorJugadores");
      document.getElementById("numJugadores").textContent = jugadores.length;

      if (!jugadores.length) {
        cont.innerHTML = '<div class="empty">No hay jugadores todavía.</div>';
        return;
      }

      cont.innerHTML = jugadores.map((j, index) => `
        <div class="player-edit">
          <div class="player-edit-top">
            <p class="player-edit-name">${escapeHtml(j.nombre || "Sin nombre")}</p>
            <div class="player-edit-actions">
              <button class="mini-btn" onclick="guardarCambiosJugador(${index})">GUARDAR</button>
              <button class="mini-btn danger" onclick="borrarJugador(${index})">BORRAR</button>
            </div>
          </div>
          <div class="edit-grid">
            <input
              id="nombre-${index}"
              class="input"
              value="${escapeHtml(j.nombre || "")}"
              placeholder="Nombre"
            />
            <input
              id="puntos-${index}"
              class="number-input"
              type="number"
              value="${Number(j.puntos || 0)}"
              placeholder="Puntos"
            />
            <input
              id="once-${index}"
              class="number-input"
              type="number"
              value="${Number(j.once || 0)}"
              placeholder="Once ideal"
            />
          </div>
        </div>
      `).join("");
    }

    function guardarCambiosJugador(index) {
      const nombre = document.getElementById(`nombre-${index}`).value.trim();
      const puntos = Number(document.getElementById(`puntos-${index}`).value || 0);
      const once = Number(document.getElementById(`once-${index}`).value || 0);

      jugadores[index] = { nombre, puntos, once };
      guardarJugadores();
      renderEditor();
      document.getElementById("estado").textContent = "Jugador actualizado.";
    }

    function borrarJugador(index) {
      if (!confirm("¿Borrar este jugador?")) return;
      jugadores.splice(index, 1);
      guardarJugadores();
      renderEditor();
      document.getElementById("estado").textContent = "Jugador borrado.";
      ultimoResumen = [];
      document.getElementById("resultado").innerHTML = '<div class="empty">Todavía no hay pagos calculados.</div>';
      document.getElementById("totalJornada").textContent = "0€";
      document.getElementById("numJugadores").textContent = jugadores.length;
    }

    function agregarJugador() {
      const input = document.getElementById("nuevoNombre");
      const nombre = input.value.trim();
      if (!nombre) return;

      jugadores.push({ nombre, puntos: 0, once: 0 });
      guardarJugadores();
      renderEditor();
      input.value = "";
      document.getElementById("estado").textContent = "Jugador añadido.";
    }

    function renderResumen(data) {
      const resultado = document.getElementById("resultado");

      if (!data.length) {
        resultado.innerHTML = '<div class="empty">No hay datos disponibles.</div>';
        return;
      }

      resultado.innerHTML = data.map(j => `
        <div class="player">
          <div class="player-top">
            <div>
              <p class="player-name">${medalla(j.posicion)} ${escapeHtml(j.nombre)}</p>
              <p class="player-meta">${j.puntos} pts · Puesto ${j.posicion} · Once ideal: ${j.once}</p>
            </div>
            <div class="badge-total">
              <div class="small">Total</div>
              <div class="big">+${euros(j.total)}</div>
            </div>
          </div>

          <div class="details">
            <div class="detail">
              <div class="d-label">Posición</div>
              <div class="d-value">${j.posicion}</div>
            </div>
            <div class="detail">
              <div class="d-label">Premio</div>
              <div class="d-value">${euros(j.premio)}</div>
            </div>
            <div class="detail">
              <div class="d-label">Bonus pts</div>
              <div class="d-value">${euros(j.bonus)}</div>
            </div>
            <div class="detail">
              <div class="d-label">Bonus once</div>
              <div class="d-value">${euros(j.bonusOnce)}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function syncComuniate() {
      const estado = document.getElementById("estado");
      estado.textContent = "Sincronizando desde Comuniate...";

      try {
        const res = await fetch(`${SCRAPER_API}/sync-comuniate`);
        const txt = await res.text();

        let data;
        try {
          data = JSON.parse(txt);
        } catch {
          throw new Error("La respuesta no es JSON válido");
        }

        if (!Array.isArray(data) || !data.length) {
          throw new Error("No se han encontrado jugadores");
        }

        jugadores = data.map(j => ({
          nombre: String(j.nombre || "").trim(),
          puntos: Number(j.puntos || 0),
          once: Number(j.once || 0)
        })).filter(j => j.nombre);

        guardarJugadores();
        renderEditor();
        document.getElementById("numJugadores").textContent = jugadores.length;
        estado.textContent = `Sincronizados ${jugadores.length} jugadores desde Comuniate.`;
      } catch (e) {
        estado.textContent = `Error al sincronizar: ${e.message}`;
      }
    }

    async function preview() {
      const btn = document.getElementById("btnPreview");
      const estado = document.getElementById("estado");

      btn.disabled = true;
      btn.textContent = "CARGANDO...";
      estado.textContent = "Calculando pagos...";

      try {
        guardarJugadores();
        const resumen = calcularPagos(jugadores);
        ultimoResumen = resumen;
        const total = resumen.reduce((acc, j) => acc + (j.total || 0), 0);

        document.getElementById("totalJornada").textContent = euros(total);
        document.getElementById("numJugadores").textContent = jugadores.length;
        renderResumen(resumen);
        estado.textContent = "Resumen cargado correctamente.";
      } catch (error) {
        estado.textContent = "Error al calcular pagos.";
      } finally {
        btn.disabled = false;
        btn.textContent = "PREVISUALIZAR";
      }
    }

    async function confirmar() {
      const btn = document.getElementById("btnPago");
      const estado = document.getElementById("estado");

      btn.disabled = true;
      btn.textContent = "ENVIANDO...";
      estado.textContent = "Enviando pagos al grupo...";

      try {
        if (!ultimoResumen.length) {
          ultimoResumen = calcularPagos(jugadores);
          renderResumen(ultimoResumen);
        }

        const res = await fetch(`${API}/confirmar`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(ultimoResumen)
        });

        const txt = await res.text();

        if (!res.ok) throw new Error(txt || "No se pudo enviar el pago.");

        estado.textContent = txt || "Pagos enviados correctamente.";
        alert("💸 Pagos enviados");
      } catch (error) {
        estado.textContent = error.message || "Error enviando pagos.";
        alert("❌ Error al enviar pagos");
      } finally {
        btn.disabled = false;
        btn.textContent = "💸 PAGO";
      }
    }

    function resetear() {
      if (!confirm("¿Seguro que quieres resetear la jornada?")) return;

      jugadores = [];
      ultimoResumen = [];
      localStorage.removeItem(STORAGE_KEY);

      renderEditor();
      document.getElementById("resultado").innerHTML = '<div class="empty">Todavía no hay pagos calculados.</div>';
      document.getElementById("totalJornada").textContent = "0€";
      document.getElementById("numJugadores").textContent = "0";
      document.getElementById("estado").textContent = "Jornada reseteada.";
    }

    renderEditor();
  </script>
</body>
</html>
